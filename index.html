<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Chụp Ảnh Gương (Đổi Cam)</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { margin: 10px 0; font-size: 20px; }
        .camera-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Mặc định lật gương khi dùng cam trước */
        .mirrored {
            transform: scaleX(-1);
        }
        /* Tắt lật gương khi dùng cam sau để chữ không bị ngược ngược xuôi xuôi */
        .normal {
            transform: scaleX(1);
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #capture-btn { background: #ff4757; }
        #switch-btn { background: #3742fa; }
        button:active { transform: scale(0.95); }
        #snapshot {
            display: none;
            margin-top: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            border: 2px solid #2ed573;
        }
    </style>
</head>
<body>

    <h2>Trạm Chụp Ảnh Gương</h2>
    
    <div class="camera-container">
        <!-- Mặc định bắt đầu bằng cam trước (mirrored) -->
        <video id="webcam" class="mirrored" autoplay playsinline muted></video>
    </div>
    
    <div class="btn-group">
        <button id="switch-btn">🔄 Đổi Cam</button>
        <button id="capture-btn">📸 Chụp Ảnh</button>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="snapshot" alt="Ảnh đã chụp">

    <script>
        const video = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const switchBtn = document.getElementById('switch-btn');
        const canvas = document.getElementById('canvas');
        const snapshot = document.getElementById('snapshot');

        // Biến lưu trạng thái camera hiện tại: 'user' (cam trước) hoặc 'environment' (cam sau)
        let currentFacingMode = 'user'; 
        let currentStream = null;

        // Hàm mở camera
        async function startCamera(facingMode) {
            // Nếu đang mở luồng cũ thì tắt đi trước để tránh kẹt cam
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: { facingMode: facingMode },
                    audio: false
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                // Tinh chỉnh hiển thị: Nếu là cam trước thì lật gương, cam sau thì giữ nguyên
                if (facingMode === 'user') {
                    video.className = 'mirrored';
                } else {
                    video.className = 'normal';
                }
            } catch (err) {
                alert("Không mở được camera! Hãy đảm bảo bạn đã cấp quyền truy cập.");
                console.error(err);
            }
        }

        // Khởi động lần đầu (cam trước)
        startCamera(currentFacingMode);

        // Sự kiện bấm nút "Đổi Cam"
        switchBtn.addEventListener('click', () => {
            // Đổi qua lại giữa cam trước ('user') và cam sau ('environment')
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        // Sự kiện bấm nút "Chụp Ảnh"
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // Nếu đang chụp từ cam trước, giữ nguyên hiệu ứng lật gương trên ảnh lưu
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            } else {
                ctx.setTransform(1, 0, 0, 1, 0, 0); // Cam sau thì giữ nguyên chiều bình thường
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Hiển thị ảnh chụp ra màn hình
            const dataUrl = canvas.toDataURL('image/png');
            snapshot.src = dataUrl;
            snapshot.style.display = 'block';
        });
    </script>

</body>
</html>
