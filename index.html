<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Chụp Ảnh Gương - Fix Lỗi Cam Sau</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { margin: 10px 0; font-size: 18px; }
        .camera-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mirrored { transform: scaleX(-1); }
        .normal { transform: scaleX(1); }
        .btn-group {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 400px;
        }
        button {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #switch-btn { background: #3742fa; }
        #mirror-btn { background: #ffa502; }
        #capture-btn { background: #ff4757; }
        button:active { transform: scale(0.95); }
        #snapshot {
            display: none;
            margin-top: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            border: 2px solid #2ed573;
        }
    </style>
</head>
<body>

    <h2>Trạm Chụp Ảnh Gương</h2>
    
    <div class="camera-container">
        <video id="webcam" class="mirrored" autoplay playsinline muted></video>
    </div>
    
    <div class="btn-group">
        <button id="switch-btn">🔄 Đổi Cam</button>
        <button id="mirror-btn">🪞 Tắt/Bật Gương</button>
        <button id="capture-btn">📸 Chụp Ảnh</button>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="snapshot" alt="Ảnh đã chụp">

    <script>
        const video = document.getElementById('webcam');
        const switchBtn = document.getElementById('switch-btn');
        const mirrorBtn = document.getElementById('mirror-btn');
        const captureBtn = document.getElementById('capture-btn');
        const canvas = document.getElementById('canvas');
        const snapshot = document.getElementById('snapshot');

        let useFrontCamera = true;
        let isMirrored = true;
        let currentStream = null;

        async function startCamera() {
            // 1. Tắt toàn bộ các luồng camera đang chạy trước đó để nhường phần cứng
            if (currentStream) {
                currentStream.getTracks().forEach(track => {
                    track.stop();
                });
                currentStream = null;
                video.srcObject = null;
            }

            // 2. Thêm độ trễ nhỏ để hệ thống điện thoại kịp giải phóng cảm biến camera
            await new Promise(resolve => setTimeout(resolve, 300));

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : { exact: "environment" }
                },
                audio: false
            };

            try {
                // Thử gọi với camera chính xác
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err1) {
                console.warn("Không bật được chính xác hướng camera, thử cách thay thế...", err1);
                try {
                    // Dự phòng nếu máy không hỗ trợ { exact: ... }
                    const fallbackConstraints = {
                        video: { facingMode: useFrontCamera ? "user" : "environment" },
                        audio: false
                    };
                    currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                    video.srcObject = currentStream;
                } catch (err2) {
                    try {
                        // Dự phòng cuối: lấy bất kỳ camera nào có sẵn để không bị đen màn hình
                        currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        video.srcObject = currentStream;
                    } catch (err3) {
                        alert("Không thể mở camera trên thiết bị này. Hãy kiểm tra quyền truy cập!");
                        console.error(err3);
                    }
                }
            }
        }

        // Khởi động lần đầu
        startCamera();

        // Nút đổi cam
        switchBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Nút Bật/Tắt gương
        mirrorBtn.addEventListener('click', () => {
            isMirrored = !isMirrored;
            if (isMirrored) {
                video.className = 'mirrored';
                mirrorBtn.style.opacity = "1";
            } else {
                video.className = 'normal';
                mirrorBtn.style.opacity = "0.6";
            }
        });

        // Nút chụp ảnh
        captureBtn.addEventListener('click', () => {
            if (!video.videoWidth) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            if (isMirrored) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            } else {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/png');
            snapshot.src = dataUrl;
            snapshot.style.display = 'block';
        });
    </script>

</body>
</html>
