<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Chụp Ảnh Gương Cải Tiến</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { margin: 10px 0; font-size: 18px; }
        .camera-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Lớp lật gương */
        .mirrored {
            transform: scaleX(-1);
        }
        /* Lớp bình thường */
        .normal {
            transform: scaleX(1);
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 400px;
        }
        button {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #switch-btn { background: #3742fa; }
        #mirror-btn { background: #ffa502; }
        #capture-btn { background: #ff4757; }
        button:active { transform: scale(0.95); }
        #snapshot {
            display: none;
            margin-top: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            border: 2px solid #2ed573;
        }
    </style>
</head>
<body>

    <h2>Trạm Chụp Ảnh Gương</h2>
    
    <div class="camera-container">
        <video id="webcam" class="mirrored" autoplay playsinline muted></video>
    </div>
    
    <div class="btn-group">
        <button id="switch-btn">🔄 Đổi Cam (Trước/Sau)</button>
        <button id="mirror-btn">🪞 Tắt/Bật Gương</button>
        <button id="capture-btn">📸 Chụp Ảnh</button>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="snapshot" alt="Ảnh đã chụp">

    <script>
        const video = document.getElementById('webcam');
        const switchBtn = document.getElementById('switch-btn');
        const mirrorBtn = document.getElementById('mirror-btn');
        const captureBtn = document.getElementById('capture-btn');
        const canvas = document.getElementById('canvas');
        const snapshot = document.getElementById('snapshot');

        let useFrontCamera = true; // Mặc định cam trước
        let isMirrored = true;     // Mặc định bật hiệu ứng gương
        let currentStream = null;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            // Cấu hình linh hoạt để ép điện thoại nhận diện đúng camera trước/sau
            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment"
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                // Dự phòng trường hợp cấu hình facingMode bị lỗi trên một số trình duyệt di động cũ
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = currentStream;
                } catch (e) {
                    alert("Không thể mở camera. Vui lòng kiểm tra lại quyền của trình duyệt!");
                    console.error(e);
                }
            }
        }

        // Chạy lần đầu
        startCamera();

        // Nút đổi cam Trước / Sau
        switchBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Nút chủ động Bật/Tắt hiệu ứng gương bất cứ lúc nào bạn muốn
        mirrorBtn.addEventListener('click', () => {
            isMirrored = !isMirrored;
            if (isMirrored) {
                video.className = 'mirrored';
                mirrorBtn.style.opacity = "1";
            } else {
                video.className = 'normal';
                mirrorBtn.style.opacity = "0.6";
            }
        });

        // Nút chụp ảnh giữ nguyên trạng thái hiển thị
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            if (isMirrored) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            } else {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/png');
            snapshot.src = dataUrl;
            snapshot.style.display = 'block';
        });
    </script>

</body>
</html>
